name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for m in 0 1; do echo "== taifex m=$m"; curl -s -X POST https://mis.taifex.com.tw/futures/api/getQuoteList -H 'Content-Type: application/json' -d "{\"MarketType\":\"$m\",\"SymbolType\":\"F\",\"KindID\":\"1\",\"CID\":\"MXF\",\"ExpireMonth\":\"\",\"RowSize\":\"全部\",\"PageNo\":\"\",\"SortColumn\":\"\",\"AscDesc\":\"A\"}" | python3 -c "
          import json,sys;L=json.load(sys.stdin)['RtData']['QuoteList']
          print(sorted(L[0].keys()) if L else None)
          for q in L: print(q.get('SymbolID'),q.get('DispCName'),q.get('DispEName'),q.get('CLastPrice'),q.get('CRefPrice'),q.get('CTotalVolume'),q.get('COpenInterest'),q.get('CDate'),q.get('CTime'))"; done
          for s in TWF:MXF:FUTURES TWF:MXF1:FUTURES TWF:MXF2:FUTURES TWF:MXFL6:FUTURES TWF:MXF202612:FUTURES TWF:MXF:FUTURES:202612 TWF:MXF.202612:FUTURES TWF:MXFL6:FUTURES:202612; do echo "== $s"; curl -s "https://ws.api.cnyes.com/ws/api/v1/quote/quotes/$s" | head -c 300; echo; done
          echo "== search"; curl -s "https://ws.api.cnyes.com/ws/api/v1/universal/quote?type=FUTURES&q=%E5%B0%8F%E5%8F%B0" | head -c 1500; echo
          curl -s "https://ess.api.cnyes.com/ess/api/v1/siteSearch/main?q=%E5%B0%8F%E5%8F%B0%E6%8C%87&limit=20" | head -c 2500; echo
