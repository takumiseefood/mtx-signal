name: 小台訊號

# 一次執行持續約 5 小時 45 分，期間每 5 分鐘（非交易時段每 30 分鐘）計算一次；
# 結束前自動啟動下一輪，不依賴 GitHub 容易延遲的排程。排程只當備援。
on:
  workflow_dispatch: {}
  schedule:
    - cron: "7 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 每 5 分鐘計算訊號、推播、更新圖表資料
        run: bash loop.sh
      - name: 啟動下一輪
        if: always()
        run: gh workflow run signal.yml --ref main -R "$REPO" || echo "下一輪啟動失敗，交給備援排程"
